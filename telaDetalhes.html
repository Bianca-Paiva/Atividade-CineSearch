<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalhes | CineSearch</title>
    <link rel="stylesheet" href="./src/css/telaDetalhes.css" />
  </head>

  <body>
    <header>
      <div class="logo-container">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          fill="currentColor"
          viewBox="0 0 16 16"
          class="logo-icon"
        >
          <path
            d="M0 1a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H1a1 1 0 0 1-1-1zm4 0v6h8V1zm8 8H4v6h8zM1 1v2h2V1zm2 3H1v2h2zM1 7v2h2V7zm2 3H1v2h2zm-2 3v2h2v-2zM15 1h-2v2h2zm-2 3v2h2V4zm2 3h-2v2h2zm-2 3v2h2v-2zm2 3h-2v2h2z"
          />
        </svg>
        <h1 class="logo">CineSearch</h1>
      </div>
    </header>

    <main class="container-detalhes">
      <div class="voltar">
        <button class="btnVoltar">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            viewBox="0 0 16 16"
            class="iconVoltar"
          >
            <path
              fill-rule="evenodd"
              d="M12 8a.5.5 0 0 1-.5.5H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5H11.5a.5.5 0 0 1 .5.5"
            />
          </svg>
          Voltar aos resultados
        </button>
      </div>
      
      <!-- LOADING -->
      <section id="loading" class="loading">
        <p>Carregando informações...</p>
      </section>

      <!-- DETALHES -->
      <section id="detalhes-filme" class="detalhes hidden">
        <article class="detalhe-card">
          <!-- POSTER -->
          <figure class="poster">
            <img id="poster" src="" alt="" />
          </figure>

          <!-- BLOCO PRINCIPAL -->
          <div class="info-principal">
            <!-- TÍTULO + NOTA -->
            <header class="titulo-section">
              <h2 id="titulo"></h2>
              <span id="nota" class="nota-imdb"></span>
            </header>

            <!-- INFORMAÇÕES RÁPIDAS -->
            <ul class="info-rapidas">
              <li id="tipo"></li>
              <li id="ano"></li>
              <li id="duracao"></li>
              <li id="classificacao"></li>
            </ul>

            <!-- SINOPSE -->
            <section class="sinopse">
              <h3>Sinopse</h3>
              <p id="sinopse-texto"></p>
            </section>

            <!-- INFORMAÇÕES TÉCNICAS -->
            <section class="info-tecnicas">
              <h3>Informações</h3>

              <div class="info-grid">
                <div><strong>Gênero:</strong> <span id="genero"></span></div>
                <div><strong>Diretor:</strong> <span id="diretor"></span></div>
                <div>
                  <strong>Roteirista:</strong> <span id="roteiro"></span>
                </div>
                <div><strong>Idioma:</strong> <span id="idioma"></span></div>
                <div><strong>País:</strong> <span id="pais"></span></div>
                <div>
                  <strong>Lançamento:</strong> <span id="lancamento"></span>
                </div>
                <div>
                  <strong>Produção:</strong> <span id="producao"></span>
                </div>
                <div>
                  <strong>Bilheteria:</strong> <span id="bilheteria"></span>
                </div>
              </div>
            </section>

            <!-- ELENCO -->
            <section class="elenco">
              <h3>Elenco Principal</h3>
              <p id="atores"></p>
            </section>

            <!-- PRÊMIOS -->
            <section class="premios">
              <h3>Prêmios e Indicações</h3>
              <p id="premios"></p>
            </section>
          </div>
        </article>
      </section>

      <!-- ERRO -->
      <section id="erro" class="erro hidden">
        <p>Não foi possível carregar os detalhes.</p>
      </section>
    </main>
  </body>
  <script src="./src/js/telaDetalhes.js"></script>
</html>

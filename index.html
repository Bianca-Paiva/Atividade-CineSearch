<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/css/styles.css" />
    <title>CineSearch</title>
  </head>
  <body>
    <header id="cabecalho"></header>
    <main>
      <div id="pesquisa-container">
        <h1 id="pesquisa-titulo">CineSearch</h1>
        <p id="pesquisa-subtitulo">Pesquise para encontrar informações detalhadas sobre filmes e séries</p>
        <div id="pesquisa-input-container">
          <input
            type="text"
            placeholder="Digite o nome do filme ou série..."
            id="pesquisa-input"
          />
          <button id="pesquisa-btn">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-search"
              viewBox="0 0 16 16"
            >
              <path
                d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"
              />
            </svg>
          </button>
        </div>
      </div>
    </main>

    <script src="/src/js/componentes.js"></script>
    <script src="/src/js/script.js"></script>
  </body>
</html>
